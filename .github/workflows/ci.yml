name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          GEMINI_API_KEY: "ci-dummy-key"
          JWT_SECRET_KEY: "ci-dummy-jwt-secret-key-for-testing"
        run: |
          pytest tests/ -v --tb=short --rootdir=.

      - name: Enforce core test coverage threshold (min 35%)
        env:
          GEMINI_API_KEY: "ci-dummy-key"
          JWT_SECRET_KEY: "ci-dummy-jwt-secret-key-for-testing"
        run: |
          pytest tests/ --cov=lol_agent.smart_camera --cov=lol_agent.lol_editor --cov=lol_agent.learning_engine --cov=lol_agent.lol_metadata_generator --cov=lol_agent.api --cov=lol_agent.lol_frag_detector --cov=lol_agent.lol_thumbnail --cov=lol_agent.autonomous --cov-report=term-missing --cov-fail-under=35


