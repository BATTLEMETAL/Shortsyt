name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov python-dotenv

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --rootdir=.

      - name: Coverage (informational only)
        if: always()
        run: |
          pytest tests/ --cov=quality_auditor --cov-report=term-missing || true
