name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          # Install only lightweight deps needed for tests (no torch, no ffmpeg)
          pip install python-dotenv difflib2 || true

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

      - name: Upload coverage report (optional)
        if: always()
        run: |
          pytest tests/ --cov=. --cov-report=term-missing --cov-report=xml || true
