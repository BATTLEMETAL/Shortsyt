name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          GEMINI_API_KEY: "ci-dummy-key"
          JWT_SECRET_KEY: "ci-dummy-jwt-secret-key-for-testing"
        run: |
          pytest tests/ -v --tb=short --rootdir=.

      - name: Coverage (informational only)
        if: always()
        env:
          GEMINI_API_KEY: "ci-dummy-key"
          JWT_SECRET_KEY: "ci-dummy-jwt-secret-key-for-testing"
        run: |
          pytest tests/ --cov=lol_agent --cov-report=term-missing || true
