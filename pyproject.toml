[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shortsyt"
version = "1.0.0"
description = "Autonomous AI Video Pipeline & Gaming Shorts Studio (OpenCV + FFmpeg + Electron + FastAPI)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Michał Zalewski", email = "mz10062001@gmail.com"},
]

keywords = ["youtube", "shorts", "computer-vision", "opencv", "ffmpeg", "fastapi", "electron", "ai-automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "opencv-python>=4.8.0",
    "pytesseract>=0.3.10",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "google-api-python-client>=2.130.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth>=2.29.0",
    "google-genai>=0.1.0",
    "yt-dlp>=2024.1.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "PyJWT>=2.8.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
