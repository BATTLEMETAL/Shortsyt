<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Authorization — Shortsyt Studio</title>
  <meta name="description" content="TikTok OAuth 2.0 PKCE Authorization Endpoint for Shortsyt Studio.">
  <link rel="icon" type="image/png" sizes="1024x1024" href="icon.png?v=20261027_2">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=20261027_2">
  <link rel="shortcut icon" href="favicon.ico?v=20261027_2">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=20261027_2">
  <meta name="tiktok-developers-site-verification" content="Y3La46jKFk9g97hsYmJV5LwzvEUhWR4z">
  <style>
    :root {
      --bg: #0A0E1A;
      --card-bg: #121624;
      --border: #1E2438;
      --gold: #C89B3C;
      --gold-light: #E5C269;
      --text: #E4D6B5;
      --text-muted: #8B8FA8;
      --text-white: #FFFFFF;
      --cyan: #00F2FE;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: var(--card-bg);
      padding: 40px 32px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      max-width: 480px;
      width: 100%;
      border: 1px solid var(--border);
      text-align: center;
    }
    .brand-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .brand-bar img {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      border: 1px solid var(--gold);
    }
    h1 { font-size: 1.5rem; margin-bottom: 8px; color: var(--text-white); }
    .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; line-height: 1.5; }
    .status { padding: 14px 18px; border-radius: 8px; font-weight: 600; font-size: 0.95rem; line-height: 1.5; }
    .info { background: rgba(0, 242, 254, 0.08); color: var(--cyan); border: 1px solid rgba(0, 242, 254, 0.25); }
    .success { background: rgba(34, 197, 94, 0.12); color: #4ade80; border: 1px solid #22c55e; }
    .error { background: rgba(239, 68, 68, 0.12); color: #f87171; border: 1px solid #ef4444; }
    .btn {
      display: inline-block;
      margin-top: 28px;
      padding: 11px 24px;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
      color: #0A0E1A;
      font-weight: 700;
      text-decoration: none;
      border-radius: 8px;
      font-size: 0.9rem;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .links {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      gap: 20px;
      font-size: 0.85rem;
    }
    .links a { color: var(--text-muted); text-decoration: none; }
    .links a:hover { color: var(--gold); text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand-bar">
      <img src="icon.png?v=20261027_2" alt="Shortsyt Studio">
      <span style="font-weight: 800; font-size: 1.3rem; color: #FFF;">Shortsyt Studio</span>
    </div>

    <h1>TikTok Authorization</h1>
    <div class="subtitle">Secure authentication gateway for Shortsyt Studio desktop application.</div>

    <div id="status" class="status info">Standby: Waiting for TikTok authorization redirect...</div>

    <a href="index.html" class="btn">&larr; Return to Homepage</a>

    <div class="links">
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms of Service</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const state = params.get('state');
    const error = params.get('error');
    const errorDesc = params.get('error_description');

    const status = document.getElementById('status');

    if (error) {
      status.className = 'status error';
      status.textContent = '❌ Authorization failed: ' + (errorDesc || error);
    } else if (code) {
      status.className = 'status success';
      status.textContent = '✅ Authorization successful! Returning to Shortsyt Studio...';

      // Relay authorization code to local desktop app
      fetch('http://localhost:8989/callback' + window.location.search, { mode: 'no-cors' })
        .then(() => {
          setTimeout(() => {
            status.textContent = '✅ Connected! You can now close this tab and return to the application.';
          }, 1500);
        })
        .catch(() => {});
    } else {
      status.className = 'status info';
      status.textContent = 'ℹ️ Standby: Ready to receive TikTok authorization response.';
    }
  </script>
</body>
</html>
