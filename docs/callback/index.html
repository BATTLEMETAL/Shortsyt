<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shortsyt — TikTok Authorization</title>
  <link rel="icon" type="image/png" href="../icon.png">
  <link rel="shortcut icon" href="../favicon.ico">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      max-width: 480px;
      text-align: center;
      border: 1px solid #334155;
    }
    h1 { font-size: 1.5rem; margin-bottom: 12px; color: #38bdf8; }
    p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    .status { margin-top: 16px; padding: 12px; border-radius: 6px; font-weight: 500; font-size: 0.9rem; }
    .success { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid #22c55e; }
    .code-box {
      margin-top: 16px;
      padding: 10px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 6px;
      color: #e2e8f0;
      font-family: monospace;
      font-size: 1rem;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>TikTok Authorization</h1>
    <p id="msg">Processing authorization response from TikTok...</p>
    <div id="status" class="status success" style="display: none;"></div>
    <div id="codeDisplay" class="code-box" style="display: none;"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const state = params.get('state');
    const error = params.get('error');
    const errorDesc = params.get('error_description');

    const msg = document.getElementById('msg');
    const status = document.getElementById('status');
    const codeDisplay = document.getElementById('codeDisplay');

    if (error) {
      msg.textContent = 'Authorization failed: ' + (errorDesc || error);
      status.textContent = '❌ Error occurred during login';
      status.className = 'status';
      status.style.background = 'rgba(239, 68, 68, 0.15)';
      status.style.color = '#f87171';
      status.style.border = '1px solid #ef4444';
      status.style.display = 'block';
    } else if (code) {
      msg.textContent = 'Authorization successful! Returning to Shortsyt...';
      status.textContent = '✅ Connected to TikTok successfully';
      status.style.display = 'block';
      codeDisplay.textContent = 'Auth code: ' + code;
      codeDisplay.style.display = 'block';

      // Forward to local server
      fetch('http://localhost:8180/callback' + window.location.search, { mode: 'no-cors' })
        .then(() => {
          setTimeout(() => { window.close(); }, 2000);
        })
        .catch(() => {});
    } else {
      msg.textContent = 'No authorization code received.';
    }
  </script>
</body>
</html>
